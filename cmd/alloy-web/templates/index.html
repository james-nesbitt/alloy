<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alloy | Browser Bridge</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/wasm_exec.js"></script>
    <script src="/static/js/bridge.js" defer></script>
</head>
<body class="bg-black text-white font-mono antialiased overflow-hidden">
    <!-- Main Shell -->
    <div id="app" class="flex flex-col h-screen overflow-hidden">
        <!-- Header -->
        <header class="flex items-center justify-between px-4 py-2 border-b border-zinc-800 bg-zinc-950">
            <div class="flex items-center space-x-4">
                <span class="text-indigo-400 font-bold tracking-tighter text-xl">ALLOY</span>
                <nav id="breadcrumbs" class="text-zinc-500 text-sm hidden md:flex items-center">
                    <span>system</span>
                    <span class="mx-2 opacity-50">/</span>
                    <span class="text-zinc-200">connected</span>
                </nav>
            </div>
            
            <div id="status-indicators" class="flex items-center space-x-4 text-xs">
                <div class="flex items-center space-x-1">
                    <span id="kernel-dot" class="w-2 h-2 rounded-full bg-zinc-600"></span>
                    <span class="text-zinc-400">KERNEL</span>
                </div>
                <button id="menu-btn" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700 rounded text-zinc-300 transition-colors">
                    MENU (F1)
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="viewport" class="flex-grow flex p-4 gap-4 overflow-hidden">
            <!-- Project/Resource Sidebar -->
            <aside id="sidebar" class="w-64 flex-shrink-0 border border-zinc-900 rounded-lg p-3 bg-zinc-950/50 hidden lg:block overflow-y-auto">
                <h3 class="text-zinc-500 text-xs font-bold mb-4 uppercase tracking-wider">Workspace</h3>
                <ul id="workspace-list" class="space-y-1">
                    <li class="p-2 text-sm text-zinc-400 italic">No workspace loaded</li>
                </ul>
            </aside>

            <!-- Active View (Canvas/Grid) -->
            <section id="content" class="flex-grow flex flex-col gap-4 overflow-hidden">
                <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto">
                    <div data-widget-id="omni-stats" class="border border-zinc-800 rounded-lg p-6 flex flex-col items-center justify-center text-zinc-400 bg-zinc-950/40">
                        <span class="text-zinc-600 italic">Initializing Omni-Palette...</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Command Panel (Omni-palette) -->
        <div id="command-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 items-center justify-center p-4">
            <div id="omni-panel" class="bg-zinc-900 border border-zinc-700 rounded-xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col">
                <!-- Search Input -->
                <div id="omni-search-container" class="flex items-center px-4 py-3 border-b border-zinc-800 bg-zinc-950">
                    <span class="text-zinc-500 mr-3 text-lg">:</span>
                    <input type="text" id="omni-input" class="bg-transparent border-none focus:outline-none w-full text-zinc-100 placeholder-zinc-600" placeholder="Type a command or search..." autofocus>
                </div>

                <!-- Results List -->
                <ul id="omni-results" class="max-h-96 overflow-y-auto py-2">
                    <!-- Results injected here -->
                </ul>

                <!-- Form Container (Hidden by default) -->
                <div id="omni-form" class="hidden flex-col p-6 space-y-4 border-t border-zinc-800">
                    <div id="form-header" class="mb-4">
                        <h2 id="form-title" class="text-xl font-bold text-white">Command Title</h2>
                        <p id="form-description" class="text-zinc-500 text-sm italic">Command description goes here.</p>
                    </div>
                    <div id="form-fields" class="space-y-4">
                        <!-- Dynamic fields injected here -->
                    </div>
                    <div id="form-actions" class="flex justify-end space-x-3 pt-4 border-t border-zinc-800">
                        <button id="form-cancel" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded transition-colors text-sm font-bold">CANCEL</button>
                        <button id="form-submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded transition-colors text-sm font-bold">EXECUTE</button>
                    </div>
                </div>

                <!-- Footer (Navigation Hints) -->
                <div id="omni-hints" class="px-4 py-2 border-t border-zinc-800 bg-zinc-950 flex justify-between text-[10px] text-zinc-500 uppercase tracking-widest font-bold">
                    <div id="hints-search" class="flex space-x-4">
                        <span>↑↓ Navigate</span>
                        <span>Enter Select</span>
                        <span>Esc Dismiss</span>
                    </div>
                    <div id="hints-form" class="hidden flex space-x-4">
                        <span>Tab Next</span>
                        <span>Enter Execute</span>
                        <span>Esc Back</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success/Error Notifications -->
        <div id="notifications" class="fixed top-12 right-4 flex flex-col space-y-2 z-[60]"></div>

        <!-- Footer / Global Status -->
        <footer class="h-8 border-t border-zinc-800 flex items-center px-4 bg-zinc-950 text-xs text-zinc-500 justify-between">
            <div class="flex items-center space-x-4">
                <span id="project-label">PROJECT: <span class="text-zinc-300">NONE</span></span>
                <span id="fps-counter" class="opacity-50">60 FPS</span>
            </div>
            <div id="telemetry" class="flex items-center space-x-4">
                <span>MEM: 12MB</span>
                <span>CPU: 0.2%</span>
            </div>
        </footer>
    </div>
</body>
</html>
