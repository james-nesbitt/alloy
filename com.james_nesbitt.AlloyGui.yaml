id: com.james_nesbitt.AlloyGui
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: alloy-gui-wrapper
finish-args:
  - --share=ipc
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-run/alloy:create

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GO111MODULE: on

modules:
  - name: alloy
    buildsystem: simple
    build-commands:
      # Build the unified tool and the GUI/Core binaries
      - go build -o /app/bin/alloy ./cmd/alloy
      - go build -o /app/libexec/alloy/alloy-core ./cmd/alloy-core
      - go build -tags gui -o /app/bin/alloy-gui ./cmd/alloy-gui-gio
      
      # We need a wrapper to ensure it runs with --dedicated by default
      - |
        cat > /app/bin/alloy-gui-wrapper <<EOF
        #!/bin/sh
        exec /app/bin/alloy gui --dedicated "\$@"
        EOF
        chmod +x /app/bin/alloy-gui-wrapper

    sources:
      - type: dir
        path: .
