name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.56.2

      - name: Run golangci-lint
        run: golangci-lint run

      - name: Run Tests
        run: go test -v -race -cover ./...

      - name: Build Core
        run: go build -o build/core cmd/alloy-core/main.go || true # Ignore failure if main.go doesn't exist yet

      - name: Build CLI
        run: go build -o build/frontend cmd/alloy/main.go || true # Ignore failure if main.go doesn't exist yet
